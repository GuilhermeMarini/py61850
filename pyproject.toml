[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "py61850"
dynamic = ["version"]
description = "Pure-Python IEC 61850 toolkit — an MMS (ISO 9506) client, and an SCL reader/writer/editor with a byte-faithful round trip. Standard library only."
readme = "README.md"
# 3.13, raised from 3.9 in 0.5.0, for two reasons that are not the same kind of
# reason and are recorded separately in CHANGELOG.md. 3.9 reached end of life in
# October 2025 and 3.10 does so in October 2026 -- that half is a date. 3.11 and
# 3.12 are still supported and were dropped for BREADTH: six interpreters is
# more compatibility surface than a library whose consumers all move together
# has reason to carry, and that half is a judgement. Raising a floor cannot
# break code that already runs -- a resolver on 3.12 is served 0.4.0 and never
# a failure -- which is why it travels in a MINOR release.
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
# NOTICE-IEC.txt travels with every wheel and sdist because two generated files
# are derived from IEC code components, whose licence requires the notice, the
# conditions and the disclaimer to be retained in redistributions of software.
license-files = ["LICENSE", "NOTICE-IEC.txt"]
# Dual-licensed: AGPL-3.0-or-later for everyone, or a commercial licence from
# the copyright holder for closed-source / hosted use -- see COMMERCIAL.md.
authors = [{ name = "Guilherme" }]
keywords = ["iec61850", "mms", "iso9506", "goose", "sampled-values", "scada", "relay", "ied", "substation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering",
]
dependencies = []  # zero runtime dependencies — keep it that way

[project.urls]
Homepage = "https://github.com/GuilhermeMarini/py61850"
Repository = "https://github.com/GuilhermeMarini/py61850"
Issues = "https://github.com/GuilhermeMarini/py61850/issues"
# ROADMAP.md until 0.5.0, which is the defect this moved: there was a Changelog
# link and no changelog behind it, so 0.4.0's notes exist only in a GitHub
# release body that cannot be diffed or installed. ROADMAP.md is forward-looking
# and keeps its own link below.
Changelog = "https://github.com/GuilhermeMarini/py61850/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/GuilhermeMarini/py61850/blob/main/ROADMAP.md"

[project.scripts]
py61850 = "py61850.cli.main:main"
mms-scan = "py61850.cli.scan:main"
mms-files = "py61850.cli.files:main"

# Single source of truth for the version: src/py61850/__init__.py.
# The release workflow refuses to publish when the git tag disagrees with it.
[tool.hatch.version]
path = "src/py61850/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/py61850"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "ROADMAP.md", "CHANGELOG.md",
           "LICENSE", "NOTICE-IEC.txt", "COMMERCIAL.md", "CONTRIBUTING.md",
           "CLA.md"]
# The SCL round-trip corpus is 44 MB of real vendor SCDs -- a development
# artefact, not something an installer needs. Shipping it would grow the sdist
# of a zero-dependency standard-library package by ~2.3 MB compressed and buy
# whoever downloads it nothing. `tests/fixtures/scl/README.md` says how to
# obtain the corpus; the tests that need it skip when it is absent.
exclude = ["tests/fixtures/scl/*.scd"]
