# Adopted in A18b, after v0.5.0. `python -m mypy` takes no arguments here, as in
# the other repositories of this workspace: the file set is this file.
[mypy]
python_version = 3.13

# `scl/` ONLY, and the boundary is a measurement rather than a shrug.
# Over the whole package mypy reports 43 errors in 15 files; 26 are in `scl/`.
# Of the 17 OUTSIDE it, 13 cannot be closed by writing a type down:
#   * 10 are the MMS mixin pattern -- `ReadMixin`, `FileServicesMixin` and
#     `DirectoryMixin` call `self._transact`, which the class they are mixed
#     into provides. Satisfying mypy means restructuring a socket-facing class
#     hierarchy whose failure paths this deliberately hermetic suite cannot
#     reach: a poor trade in a tree with no bench relay in the loop.
#   * 2 are `osi/cotp.py`'s `self.sock = None` before `connect()` -- same
#     shape, same untested paths.
#   * 1 is `core/quality.py`, where `__slots__` and the attributes are BOTH
#     generated from `_FLAGS` by `setattr`. Writing them out for mypy means
#     maintaining that table twice, which is the drift this project's
#     conventions exist to prevent -- created by the tool meant to prevent it.
# Inside `scl/`, only 2 of 26 were inexpressible. That ratio is the reason for
# the boundary, and the boundary moves when the MMS client gets a test harness
# that does not need hardware -- not before.
files = src/py61850

namespace_packages = True
explicit_package_bases = True
mypy_path = src

# The same flags `pac-ct` runs, so a type that crosses the seam between the two
# repositories means the same thing on both sides of it.
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True

# `files` names the package and the SCOPE is enforced here, per module, because
# `files` alone does not do it: mypy follows imports out of `scl/` and reports
# errors in what it reaches. That was invisible locally -- in a virtualenv where
# `py61850` is installed, the followed modules resolve as an installed package
# and their errors are suppressed -- and CI, which installs nothing, reported all
# 13 of them. Same lesson as the 3.14/3.13 one in this phase: a result taken in
# one environment is about that environment.
#
# `ignore_errors`, not an exclusion: `scl/` imports `..errors` and `..core`, and
# it should keep getting accurate types out of them. This suppresses errors
# REPORTED IN these modules without hiding them from the modules that use them.
[mypy-py61850.mms.*]
ignore_errors = True
[mypy-py61850.osi.*]
ignore_errors = True
[mypy-py61850.link.*]
ignore_errors = True
[mypy-py61850.goose.*]
ignore_errors = True
[mypy-py61850.sv.*]
ignore_errors = True
[mypy-py61850.cli.*]
ignore_errors = True
[mypy-py61850.core.*]
ignore_errors = True
[mypy-py61850.__main__]
ignore_errors = True
