# Offline test matrix. The suite opens no sockets and needs no relay, so every
# job here is hermetic — see tests/README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The whole supported range, which `requires-python = ">=3.13"` makes
        # two versions rather than six as of 0.5.0. A matrix that started above
        # the declared floor would leave the oldest supported Python untested.
        os: [ubuntu-latest]
        python: ["3.13", "3.14"]
        include:
          # Applications built on this library run on Windows, so cover both
          # ends of the supported range there rather than Linux only. The range
          # is narrower than it was and the rule is unchanged: 3.13 and 3.14
          # are still both ends of it.
          - { os: windows-latest, python: "3.13" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Assert zero runtime dependencies
        # The defining constraint of the package: `pip install py61850` must
        # pull nothing. A stray dependency should fail the build, not ship.
        run: >
          python -c "import importlib.metadata as md;
          r = md.requires('py61850') or [];
          assert not r, f'unexpected runtime dependencies: {r}';
          print('zero runtime dependencies')"

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Byte-compile
        run: python -m compileall -q src tests

      - name: Public API imports clean
        run: python -c "import py61850 as m; print(m.__version__, m.__all__)"

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # DEVELOPMENT dependencies, pinned here and deliberately NOT declared in
      # `[project.optional-dependencies]`. `importlib.metadata.requires()`
      # returns extras WITH their markers, so a `dev` extra would appear in the
      # list the "Assert zero runtime dependencies" step above asserts is empty
      # -- the tooling adopted to raise the standard would break the check that
      # defines the package. The pins are exact so a new ruff release cannot
      # fail an unrelated pull request.
      - name: Install the tooling
        run: python -m pip install ruff==0.16.7 mypy==2.3.1

      # One job, not five matrix rows: neither tool's answer varies by OS or by
      # interpreter -- `ruff.toml` fixes `target-version` and `mypy.ini` fixes
      # `python_version`, both at the declared 3.13 floor.
      - name: Lint
        run: python -m ruff check .

      # No arguments: the file set is `mypy.ini`, which scopes this to `scl/`
      # for the measured reason recorded there.
      - name: Type-check
        run: python -m mypy

  build:
    name: Build & verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install the wheel clean and exercise the public surface
        # Catches packaging faults the editable install cannot see — a missing
        # py.typed, a module left out of the wheel, a broken console script.
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/python -m pip install --quiet --no-index dist/*.whl
          /tmp/wheeltest/bin/python -c "import py61850 as m; print(m.__version__, m.__all__)"
          /tmp/wheeltest/bin/python -c "
          import pathlib, py61850
          marker = pathlib.Path(py61850.__file__).parent / 'py.typed'
          assert marker.exists(), 'py.typed missing from the wheel'
          print('py.typed shipped')"
          /tmp/wheeltest/bin/py61850 --help
          /tmp/wheeltest/bin/mms-scan --help > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
